<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="ganttBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="ganttBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="ganttBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle dynamic floating / sliding elements in background */
      @keyframes floatPill1 {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(10px) translateX(-5px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes shimmerBar {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-item-1 {
        animation: floatPill1 6s ease-in-out infinite;
      }
      .floating-item-2 {
        animation: floatPill2 7s ease-in-out infinite;
      }
      .pulse-item {
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Blueprint Pattern in Background -->
  <g opacity="0.1">
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="136" x2="1200" y2="136" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="204" x2="1200" y2="204" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    
    <line x1="240" y1="0" x2="240" y2="340" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="340" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="720" y1="0" x2="720" y2="340" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="960" y1="0" x2="960" y2="340" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Animated Glowing Background Elements (Deep Layer) -->
  <g class="pulse-item">
    <circle cx="1060" cy="70" r="140" fill="#38bdf8" filter="blur(60px)" opacity="0.15" />
    <circle cx="150" cy="280" r="120" fill="#818cf8" filter="blur(50px)" opacity="0.15" />
    <circle cx="850" cy="270" r="100" fill="#c084fc" filter="blur(45px)" opacity="0.12" />
  </g>

  <!-- Interactive Dynamic Gantt / WBS Card Illustration (Right side, backdrop) -->
  <g transform="translate(740, 45)" class="floating-item-1" opacity="0.88">
    <!-- Mini Gantt Panel Window -->
    <rect x="0" y="0" width="410" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="38" rx="12" fill="#0f172a" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="80" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">WBS Schedule &amp; Task Decomposition</text>

    <!-- Gantt Rows & Bars -->
    <line x1="20" y1="85" x2="390" y2="85" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="20" y1="135" x2="390" y2="135" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="20" y1="185" x2="390" y2="185" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="20" y1="235" x2="390" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Gantt Bar 1 -->
    <rect x="35" y="58" width="140" height="18" rx="6" fill="url(#ganttBar1)" />
    <circle cx="175" cy="67" r="4" fill="#38bdf8" />
    
    <!-- Dependency Line -->
    <path d="M 175 67 L 205 67 L 205 108 L 220 108" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />

    <!-- Gantt Bar 2 -->
    <rect x="220" y="99" width="130" height="18" rx="6" fill="url(#ganttBar2)" />
    
    <!-- Dependency Line 2 -->
    <path d="M 310 117 L 310 159 L 140 159 L 140 159" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Gantt Bar 3 -->
    <rect x="80" y="150" width="170" height="18" rx="6" fill="url(#ganttBar3)" />
    
    <!-- Milestone Marker -->
    <polygon points="320,195 329,207 320,219 311,207" fill="#f59e0b" />
    <text x="338" y="211" font-family="sans-serif" font-size="11" fill="#fbbf24" font-weight="600">Sprint Milestone</text>
  </g>

  <!-- Floating Dynamic Pill Badges -->
  <g class="floating-item-2" transform="translate(680, 20)">
    <rect x="0" y="0" width="115" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="14" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">📊 Gantt Charts</text>
  </g>

  <g class="floating-item-1" transform="translate(980, 265)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="14" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">🌳 Deep Hierarchy</text>
  </g>

  <!-- FOREGROUND TEXT AND HEADINGS (Guaranteed Clear & Legible) -->
  <g transform="translate(65, 0)">
    <!-- Header Category Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text">
      Awesome Project Planning &amp;
    </text>
    <text x="0" y="190" class="title-text" fill="url(#primaryGrad)">
      Work Breakdown Structures
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text">
      Discover top SaaS platforms &amp; open-source alternatives for decomposing projects,
    </text>
    <text x="0" y="259" class="subtitle-text">
      estimating effort, Gantt scheduling, and critical path analysis.
    </text>

    <!-- Interactive Feature Pills -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="19" class="tag-text">📌 WBS Modules</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="19" class="tag-text">⚡ Predictive Sched</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(299, 0)">
        <rect x="0" y="0" width="125" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="19" class="tag-text">🌐 Self-Hosted</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(436, 0)">
        <rect x="0" y="0" width="115" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="15" y="19" class="tag-text">⭐ Free Tiers</text>
      </g>
    </g>
  </g>
</svg>
